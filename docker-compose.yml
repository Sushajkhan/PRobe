services:
  postgres:
    image: postgres:16-alpine
    container_name: probe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probepass
      POSTGRES_DB: probe
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probe_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: probe_server
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://probe:probepass@postgres:5432/probe
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: http://server:3000
    container_name: probe_client
    restart: unless-stopped
    ports: ["3001:3001"]
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
