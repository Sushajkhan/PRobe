version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: probe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probepass
      POSTGRES_DB: probe
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probe_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: probe_server
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://probe:probepass@postgres:5432/probe
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
